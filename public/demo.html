<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Luyện Tập Solo - Đại Hải Chiến 400 Ô (A-T × 1-20)</title>
  <link rel="stylesheet" href="css/naval-light.css">
  <style>
    body {
      background: #f0f7ff;
      color: var(--navy-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .demo-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .demo-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--border-ocean);
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
      gap: 12px;
    }

    .demo-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
      flex: 1;
    }

    @media (max-width: 1024px) {
      .demo-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="js/game-engine.js"></script>
  <script src="js/audio.js"></script>
</head>
<body>

  <div class="demo-container">

    <!-- Header điều khiển Solo -->
    <header class="demo-header-bar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 1.8rem;">⚓</span>
        <div>
          <h1 style="font-size: 1.25rem; font-weight: 900; color: var(--navy-dark); letter-spacing: 0.5px;">
            ĐẠI HẢI CHIẾN: CHẾ ĐỘ LUYỆN TẬP SOLO
          </h1>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
            <span class="badge" style="background: #e0f2fe; color: #0284c7; font-weight: 800;">🎮 BẠN vs 3 BOT AI</span>
            <span class="badge" style="background: #f1f5f9; color: #475569;">🗺️ 400 Ô (A-T × 1-20)</span>
            <span id="demoPhaseBadge" class="badge" style="background: #fef3c7; color: #d97706;">CHIẾN ĐẤU</span>
          </div>
        </div>
      </div>

      <!-- Đồng hồ 60s & Lượt hiện tại -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div id="demoTurnBox" style="display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 8px; background: #f0f9ff; border: 2px solid #0284c7;">
          <span style="font-size: 1.1rem;">🎯</span>
          <span id="demoTurnText" style="font-size: 1rem; font-weight: 900; color: var(--navy-dark);">ĐẾN LƯỢT BẠN</span>
        </div>
        <div id="demoTimerBadge" class="turn-timer-badge">
          <span>⏱️</span>
          <span id="demoTimerText">60s</span>
        </div>
      </div>

      <!-- Nút thao tác -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="btnSoundToggle" class="btn btn-outline" style="padding: 6px 12px;">🔊 Âm Thanh</button>
        <button id="btnNewGame" class="btn btn-danger" style="padding: 6px 14px;">🔄 Ván Mới</button>
        <a href="index.html" class="btn btn-outline" style="padding: 6px 14px;">🏠 Trang Chủ</a>
      </div>
    </header>

    <!-- Bố cục tác chiến -->
    <main class="demo-layout">
      
      <!-- Cột trái: Hải đồ 400 ô & Điều khiển tác chiến -->
      <section class="glass-panel" style="padding: 14px; display: flex; flex-direction: column; gap: 10px;">
        
        <!-- Thanh chọn kỹ năng & Nhập tọa độ -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border-ocean);">
          
          <!-- Kỹ năng -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 0.8rem; font-weight: 800; color: var(--navy-dark);">⚔️ VŨ KHÍ:</span>
            <button id="btnModeNormal" class="btn btn-primary" style="padding: 6px 10px; font-size: 0.8rem;">🎯 Bắn Thường</button>
            <button id="btnModeRadar" class="btn btn-outline" style="padding: 6px 10px; font-size: 0.8rem; border-color: #0284c7; color: #0284c7;">
              📡 Radar 3x3 (<span id="radarCountText">2/2</span>)
            </button>
            <button id="btnModeCrossfire" class="btn btn-outline" style="padding: 6px 10px; font-size: 0.8rem; border-color: #ea580c; color: #ea580c;">
              🚀 Chữ Thập (+) (<span id="crossfireCountText">1/1</span>)
            </button>
          </div>

          <!-- Nhập tọa độ -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 0.8rem; font-weight: 800; color: var(--navy-dark);">🎯 TỌA ĐỘ:</span>
            <input type="text" id="inputDemoCoord" placeholder="VD: B14" maxlength="4" style="width: 75px; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 800; text-align: center; text-transform: uppercase;">
            <button id="btnDemoFire" class="btn btn-danger" style="padding: 6px 14px; font-weight: 800;">🚀 KHAI HỎA</button>
          </div>

          <!-- Zoom -->
          <div style="display: flex; gap: 4px;">
            <button id="btnZoomIn" class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75rem;">🔍+</button>
            <button id="btnZoomOut" class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75rem;">🔍-</button>
            <button id="btnZoomReset" class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75rem;">🔄</button>
          </div>
        </div>

        <!-- Banner thông báo kỹ năng -->
        <div id="demoSkillBanner" style="display: none; padding: 8px 14px; border-radius: 8px; font-weight: 800; text-align: center; font-size: 0.9rem;"></div>

        <!-- Hải đồ 400 ô -->
        <div class="ocean-map-wrapper" style="flex: 1; overflow: auto; max-height: 65vh;">
          <div id="demoOceanGrid" class="ocean-grid" style="transition: transform 0.2s ease; transform-origin: top left;">
            <!-- Render bằng demo.js -->
          </div>
        </div>
      </section>

      <!-- Cột phải: Hạm đội của bạn, Bảng xếp hạng & Nhật ký -->
      <aside style="display: flex; flex-direction: column; gap: 12px;">
        
        <!-- Hạm đội của bạn -->
        <div class="glass-panel" style="padding: 12px;">
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 8px;">
            🛡️ HẠM ĐỘI CỦA BẠN (HẢI ƯNG):
          </div>
          <div id="myFleetList" class="my-fleet-status">
            <!-- Render tự động -->
          </div>
        </div>

        <!-- Bảng xếp hạng 4 Đội -->
        <div class="glass-panel" style="padding: 12px;">
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 8px;">
            🏆 BẢNG XẾP HẠNG TRỰC TIẾP:
          </div>
          <div id="demoLeaderboard" style="display: flex; flex-direction: column; gap: 6px;">
            <!-- Render tự động -->
          </div>
        </div>

        <!-- Nhật ký chiến sự -->
        <div class="glass-panel" style="padding: 12px; flex: 1; display: flex; flex-direction: column;">
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 8px;">
            📜 NHẬT KÝ TÁC CHIẾN:
          </div>
          <div id="demoCombatLog" style="flex: 1; overflow-y: auto; max-height: 220px; display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem;">
            <!-- Log items -->
          </div>
        </div>

      </aside>

    </main>

  </div>

  <script src="js/demo.js"></script>
</body>
</html>
